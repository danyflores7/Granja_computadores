# ==============================================================================
# Docker Compose para Nodo Individual en Clúster MPICH Híbrido
# Arquitectura: Tailscale sidecar + MPI node con network namespace compartido
# Esto elimina el problema de NAT/masquerading de Docker Desktop en Mac/Windows
# ==============================================================================

version: '3.8'

services:

  # ---------------------------------------------------------------
  # Tailscale sidecar: crea la interfaz VPN y maneja el networking
  # Los puertos de Docker se mapean aquí porque mpi-node comparte
  # el namespace de red de este contenedor.
  # ---------------------------------------------------------------
  tailscale:
    image: tailscale/tailscale:latest
    container_name: mpi_tailscale
    hostname: ${TS_HOSTNAME:-mpi-node}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ROUTES=
      - TS_ACCEPT_DNS=false
    volumes:
      - tailscale_state:/var/lib/tailscale
    ports:
      # Puerto SSH para orquestación MPI (remapeado a 2222 en el host)
      - "2222:22"
      # Rango de puertos MPI/Hydra (fallback para red física si Tailscale falla)
      # - "10000-10010:10000-10010"
    restart: unless-stopped

  # ---------------------------------------------------------------
  # MPI Node: comparte el namespace de red del sidecar Tailscale
  # Esto permite que los procesos MPI usen la IP de Tailscale (100.x.x.x)
  # directamente, sin restricciones de puerto ni NAT de Docker Desktop
  # ---------------------------------------------------------------
  mpi-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpi_cluster_node
    # Clave: compartir el stack de red del sidecar de Tailscale
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    volumes:
      - .:/home/mpiuser/reto_final
    cap_add:
      - NET_ADMIN
    environment:
      - MPICH_PORT_RANGE=10000:10010
      - MPIEXEC_PORT_RANGE=10000:10010
    restart: unless-stopped

volumes:
  tailscale_state:
