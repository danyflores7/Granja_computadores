# ==============================================================================
# Docker Compose para Nodo Individual en Clúster MPICH Híbrido
# Diseñado para Mac M1 (Apple Silicon) y Windows x86_64 usando Tailscale
# ==============================================================================

version: '3.8'

services:
  mpi-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mpi_cluster_node
    cap_add:
      - NET_ADMIN
    # Reiniciar el contenedor automáticamente a menos que se detenga manualmente
    restart: unless-stopped
    
    # Mapeo de Puertos Fijos para comunicación a través de la red de Tailscale:
    # 1. SSH para la orquestación e inicio de procesos de MPI.
    # 2. Rango de puertos configurado en el Dockerfile para comunicaciones internas de MPI (Hydra).
    ports:
      - "2222:22"
      - "10000-10010:10000-10010"
      
    # Montaje de volumen local para sincronizar código e imágenes dinámicamente
    volumes:
      - .:/home/mpiuser/reto_final
      
    # Variables de entorno adicionales
    environment:
      - DOCKER_HOST_IP=127.0.0.1
      - MPICH_PORT_RANGE=10000:10010
      - MPIEXEC_PORT_RANGE=10000:10010

    # Nota sobre red 'host': 
    # En Linux nativo, se podría utilizar 'network_mode: "host"'. Sin embargo, en macOS y 
    # Windows, Docker corre sobre una máquina virtual, por lo que el modo 'host' no mapea 
    # los puertos directamente a las interfaces de red del host (incluyendo la IP de Tailscale). 
    # La solución de arriba (mapeo explícito de puertos) es la única compatible y robusta 
    # multiplataforma.
